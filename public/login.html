<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Teleprompter – Login" />
  <title>Teleprompter – Login</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="cinema-bg" aria-hidden="true">
    <div class="film-strip film-strip--left"></div>
    <div class="film-strip film-strip--right"></div>
    <div class="spotlight"></div>
  </div>

  <main class="login-stage">

    <div class="login-card" role="main">

      <div class="card-top">
        <div class="clapperboard" aria-hidden="true">🎬</div>
        <h1 class="card-title">Teleprompter</h1>
        <p class="card-subtitle">Sign in to continue</p>
      </div>

      <form id="login-form" novalidate autocomplete="off">

        <div class="field-group">
          <label for="username" class="field-label">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            class="field-input"
            placeholder="Your username"
            autocomplete="username"
            required
            maxlength="100"
            aria-describedby="login-error"
          />
        </div>

        <div class="field-group">
          <label for="password" class="field-label">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              class="field-input"
              placeholder="Your password"
              autocomplete="current-password"
              required
              maxlength="200"
              aria-describedby="login-error"
            />
            <button
              type="button"
              id="btn-show-password"
              class="btn-eye"
              aria-label="Show password"
              tabindex="0"
            >&#128065;</button>
          </div>
        </div>

        <p id="login-error" class="error-msg" role="alert" aria-live="assertive"></p>

        <button type="submit" id="btn-login" class="btn-submit">
          <span id="btn-login-label">Enter</span>
          <span id="btn-login-spinner" class="spinner hidden" aria-hidden="true"></span>
        </button>

      </form>

    </div>

  </main>

  <script src="js/login.js"></script>
</body>
</html>
