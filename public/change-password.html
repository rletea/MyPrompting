<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Teleprompter – Change Password" />
  <title>Teleprompter – Change Password</title>
  <link rel="stylesheet" href="css/login.css" />
  <style>
    .change-card { max-width: 420px; }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.8rem;
      color: #9a8a6a;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.15s;
    }
    .back-link:hover { color: #d4a930; }
    .success-msg {
      min-height: 1.2em;
      font-size: 0.8rem;
      color: #4caf82;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="cinema-bg" aria-hidden="true">
    <div class="film-strip film-strip--left"></div>
    <div class="film-strip film-strip--right"></div>
    <div class="spotlight"></div>
  </div>

  <main class="login-stage">

    <div class="login-card change-card" role="main">

      <div class="card-top">
        <div class="clapperboard" aria-hidden="true">🔑</div>
        <h1 class="card-title">Change Password</h1>
        <p class="card-subtitle" id="logged-in-as">Logged in</p>
      </div>

      <form id="change-form" novalidate autocomplete="off">

        <div class="field-group">
          <label for="current-password" class="field-label">Current Password</label>
          <div class="password-wrap">
            <input
              id="current-password"
              type="password"
              class="field-input"
              placeholder="Your current password"
              required
              maxlength="200"
              autocomplete="current-password"
            />
            <button type="button" class="btn-eye" data-target="current-password" aria-label="Show password">&#128065;</button>
          </div>
        </div>

        <div class="field-group">
          <label for="new-password" class="field-label">New Password</label>
          <div class="password-wrap">
            <input
              id="new-password"
              type="password"
              class="field-input"
              placeholder="New password (min 6 chars)"
              required
              minlength="6"
              maxlength="200"
              autocomplete="new-password"
            />
            <button type="button" class="btn-eye" data-target="new-password" aria-label="Show password">&#128065;</button>
          </div>
        </div>

        <div class="field-group">
          <label for="confirm-password" class="field-label">Confirm New Password</label>
          <div class="password-wrap">
            <input
              id="confirm-password"
              type="password"
              class="field-input"
              placeholder="Repeat new password"
              required
              maxlength="200"
              autocomplete="new-password"
            />
            <button type="button" class="btn-eye" data-target="confirm-password" aria-label="Show password">&#128065;</button>
          </div>
        </div>

        <p id="change-error"   class="error-msg"   role="alert"  aria-live="assertive"></p>
        <p id="change-success" class="success-msg" role="status" aria-live="polite"></p>

        <button type="submit" id="btn-change" class="btn-submit">
          <span id="btn-change-label">Update Password</span>
          <span id="btn-change-spinner" class="spinner hidden" aria-hidden="true"></span>
        </button>

      </form>

      <a href="/" class="back-link">← Back to Teleprompter</a>

    </div>

  </main>

  <script src="js/change-password.js"></script>
</body>
</html>
